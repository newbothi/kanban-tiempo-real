name: CI

on:
  push:
    branches: [main]
  pull_request:

# S-12: el token del workflow solo puede leer. Los jobs que necesitan más lo piden ellos.
permissions:
  contents: read

# Un PR que recibe otro push cancela la corrida anterior. En main no se cancela nada,
# para que cada merge quede probado y publicado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Solo para CI: la base de prueba vive dentro del contenedor del servicio.
  MSSQL_SA_PASSWORD: Kanban_CI_2026!
  DATABASE_URL: sqlserver://localhost:1433;database=kanban_test;user=sa;password=Kanban_CI_2026!;encrypt=true;trustServerCertificate=true
  JWT_SECRET: secreto-de-ci-con-mas-de-32-caracteres-xxxx

# S-23: todas las actions van fijadas por SHA (el comentario dice la versión). Dependabot las actualiza.
jobs:
  check:
    name: Lint, tipos, tests unitarios y build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w @kanban/api
      - name: ESLint (API, paquete compartido y web)
        run: npm run lint
      - run: npm run typecheck
      - name: Tests unitarios de la API
        run: npm run test:unit -w @kanban/api
      - name: Tests del paquete compartido (cobertura mínima 80 %)
        run: npm run test:coverage -w @kanban/shared
      - name: Tests de componentes del front (cobertura mínima 75 %)
        run: npm run test:coverage -w @kanban/web
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cobertura-web-y-compartido
          path: |
            apps/web/coverage
            packages/shared/coverage
          retention-days: 14

  ml:
    name: Servicio ML (Python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/ml/requirements*.txt
      - name: Instalar dependencias (versiones fijas y verificadas por hash)
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Ruff (lint + reglas de seguridad)
        run: ruff check --output-format github .
      - name: mypy (tipos estrictos)
        run: mypy
      - name: Bandit (análisis de seguridad)
        run: bandit -c pyproject.toml -r app
      - name: Tests, incluidos los de propiedades con Hypothesis (cobertura mínima 80 %)
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml
        env:
          HYPOTHESIS_PROFILE: ci # semilla fija y más ejemplos: el CI no puede fallar "a veces"
      - name: El contrato (OpenAPI → TypeScript) está al día
        working-directory: .
        run: |
          (cd apps/ml && python -m scripts.export_openapi openapi.json)
          npm run ml:types -w @kanban/shared
          git diff --exit-code -- apps/ml/openapi.json packages/shared/src/ml-api.ts \
            || (echo "::error::Cambió la API de Python: corre 'npm run ml:types' y commitea los archivos generados"; exit 1)

  dependencies:
    name: Dependencias y secretos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks revisa todos los commits del PR
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm audit (cualquier vulnerabilidad conocida falla)
        run: npm audit --audit-level=low
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: pip-audit (dependencias de Python)
        working-directory: apps/ml
        run: |
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          pip-audit --strict -r requirements.txt -r requirements-dev.txt --require-hashes --disable-pip
      - name: gitleaks (secretos en el código o en el historial)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  integration:
    name: API + E2E contra SQL Server
    runs-on: ubuntu-24.04
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Kanban_CI_2026!
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Kanban_CI_2026! -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Crear base de prueba
        run: >
          docker exec ${{ job.services.mssql.id }}
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C
          -Q "IF DB_ID('kanban_test') IS NULL CREATE DATABASE kanban_test"
      - run: npm run db:generate -w @kanban/api
      - name: Tests de la API, unitarios + integración (cobertura mínima 80 %)
        run: npm run test:coverage -w @kanban/api
      - name: Resumen de cobertura
        if: always()
        run: |
          f=apps/api/coverage/coverage-summary.json
          [ -f "$f" ] && node -e "
            const s = require('./$f');
            const t = s.total;
            console.log('::notice title=Cobertura API::' + ['lines','statements','functions','branches'].map(k=>k+' '+t[k].pct+'%').join(' · '));
            // Los archivos con menos ramas cubiertas: por dónde empezar si baja el umbral.
            const low = Object.entries(s).filter(([k]) => k !== 'total')
              .map(([k, v]) => [k.replace(/.*apps\/api\//, ''), v.branches])
              .filter(([, b]) => b.total > 0 && b.pct < 80)
              .sort((a, b) => (b[1].total - b[1].covered) - (a[1].total - a[1].covered)).slice(0, 8);
            for (const [k, b] of low) console.log('::notice title=Ramas sin cubrir::' + k + ' ' + b.covered + '/' + b.total + ' (' + b.pct + '%)');
          " || true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/ml/requirements*.txt
      - name: Levantar el servicio ML para los E2E
        working-directory: apps/ml
        run: |
          pip install --require-hashes -r requirements.txt
          nohup python -m uvicorn app.main:app --port 8000 > ml.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/web
      - name: Tests E2E (Chromium, Firefox, WebKit y móvil, con axe)
        run: npm run test:e2e
        env:
          ML_URL: http://127.0.0.1:8000
          E2E_EXPECT_ML: '1'
      - name: Resumen de los E2E
        if: always()
        working-directory: apps/web
        run: |
          f=test-results/e2e.json
          [ -f "$f" ] && node -e "
            const r = require('./$f'); const s = r.stats;
            console.log('::notice title=E2E::' + s.expected + ' OK · ' + s.unexpected + ' fallidos · ' + s.flaky + ' inestables · ' + s.skipped + ' omitidos');
          " || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cobertura-api
          path: apps/api/coverage
          retention-days: 14
      - name: Reporte de Playwright (incluye los resultados de axe de cada pantalla)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-y-axe
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  stack:
    name: Imágenes en marcha (smoke, ZAP y k6)
    # Las dos imágenes, tal como se publican, contra un SQL Server real. Si algo falla aquí,
    # el job que publica (docker) no corre. Corre en paralelo con los E2E.
    needs: [check, ml, dependencies]
    runs-on: ubuntu-24.04
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Kanban_CI_2026!
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Kanban_CI_2026! -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      STACK_DB_URL: sqlserver://localhost:1433;database=kanban_stack;user=sa;password=Kanban_CI_2026!;encrypt=true;trustServerCertificate=true
      # Fijadas por digest (S-23). Para actualizarlas: el paso «Digests» del CI muestra los actuales.
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6
      K6_IMAGE: grafana/k6@sha256:e66db15b860113878fa74670e31f5e274830b7b6e42c8bff28b2f2d86a257603
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Base de datos y migraciones (como en Azure, desde fuera del contenedor)
        run: |
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
            -P "$MSSQL_SA_PASSWORD" -C -Q "IF DB_ID('kanban_stack') IS NULL CREATE DATABASE kanban_stack"
          DATABASE_URL="$STACK_DB_URL" npm run db:deploy -w @kanban/api
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construir la imagen de la API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: kanban-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Construir la imagen del ML
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/ml
          load: true
          tags: kanban-ml:ci
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml
      - name: Levantar las dos imágenes (modo producción)
        run: |
          ML_TOKEN=$(openssl rand -hex 24); JWT_SECRET=$(openssl rand -base64 48)
          echo "::add-mask::$ML_TOKEN"; echo "::add-mask::$JWT_SECRET"
          docker run -d --name kanban-ml --network host -e ML_TOKEN="$ML_TOKEN" -e PORT=8000 kanban-ml:ci
          docker run -d --name kanban-api --network host -e NODE_ENV=production -e PORT=3000 \
            -e DATABASE_URL="$STACK_DB_URL" -e JWT_SECRET="$JWT_SECRET" \
            -e ML_URL=http://127.0.0.1:8000 -e ML_TOKEN="$ML_TOKEN" kanban-api:ci
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/health >/dev/null && curl -sf http://127.0.0.1:8000/health >/dev/null && exit 0
            sleep 2
          done
          echo "::error::Las imágenes no quedaron sanas en 2 minutos"; exit 1
      - name: Smoke test de las dos imágenes
        run: qa/smoke.sh
      - name: ZAP baseline (escaneo pasivo de seguridad)
        run: |
          mkdir -p zap && cp qa/zap/reglas.tsv zap/ && chmod -R 777 zap
          set +e
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://127.0.0.1:3000 -c reglas.tsv -r zap.html -J zap.json -I -m 2
          code=$?
          set -e
          [ -f zap/zap.json ] && jq -r '.site[].alerts[] | "::warning title=ZAP \(.riskdesc)::\(.name) (\(.pluginid)) en \(.instances | length) URL"' zap/zap.json || true
          exit $code
      - name: k6 (50 personas moviendo tarjetas + carga de /metrics)
        run: |
          mkdir -p k6 && chmod 777 k6
          set +e
          docker run --rm --network host -v "$PWD/qa/k6:/scripts:ro" -v "$PWD/k6:/out" -w /out \
            -e API_URL=http://127.0.0.1:3000 "$K6_IMAGE" run --quiet --no-color /scripts/carga.js > k6/k6.log 2>&1
          code=$?
          set -e
          [ -f k6/k6-resumen.txt ] && sed 's/^/::notice title=k6::/' k6/k6-resumen.txt | head -5
          if [ "$code" != 0 ]; then
            grep -iE "level=(error|warning)|threshold|crossed" k6/k6.log | sort | uniq -c | sort -rn | head -12 | sed 's/^/::error title=k6::/'
            tail -25 k6/k6.log
          fi
          exit $code
      - name: Logs de los contenedores
        if: failure()
        run: |
          # Los errores de la API (pino, nivel 50) como anotaciones: el mensaje y el código de error.
          docker logs kanban-api 2>&1 | grep '"level":50' | jq -r '"\(.err.code // "") \(.err.message // .msg)"' 2>/dev/null \
            | cut -c1-200 | sort | uniq -c | sort -rn | head -8 | sed 's/^/::error title=Log de la API::/' || true
          docker logs kanban-api 2>&1 | tail -80
          docker logs kanban-ml 2>&1 | tail -40
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-y-k6
          path: |
            zap
            k6
          retention-days: 14

  docker:
    name: Imagen Docker (${{ matrix.name }})
    # En los PR: construye y escanea. En main, y solo si TODO lo anterior pasó: además publica.
    needs: [check, ml, dependencies, integration, stack]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # publicar en GHCR (solo se usa en main)
      id-token: write # firmar la procedencia (provenance) del build
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Opcional: URL del webhook de Azure (Centro de implementación) para redesplegar solo.
      AZURE_WEBHOOK: ${{ secrets.AZURE_WEBAPP_WEBHOOK }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            suffix: ''
          - name: ml
            context: apps/ml
            suffix: '-ml'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir (sin publicar)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: kanban-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # trivy-action: nunca por tag. v0.35.0 fue el único tag que no se alteró en el incidente de
      # marzo de 2026; las versiones nuevas que proponga Dependabot se revisan antes de fusionar.
      - name: Trivy (escaneo de la imagen)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kanban-${{ matrix.name }}:ci
          version: v0.69.3
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-${{ matrix.name }}.json
      - name: Falla si hay vulnerabilidades HIGH/CRITICAL con arreglo disponible
        run: |
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? |
            "::error title=\(.Severity) \(.VulnerabilityID)::\(.PkgName) \(.InstalledVersion) → \(.FixedVersion) (\($t))"' \
            trivy-${{ matrix.name }}.json | sort -u | tee hallazgos.txt
          [ ! -s hallazgos.txt ]
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kanban-${{ matrix.name }}:ci
          version: v0.69.3
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json
          skip-setup-trivy: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: |
            sbom-${{ matrix.name }}.cdx.json
            trivy-${{ matrix.name }}.json
          retention-days: 30

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar en GHCR
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          # Sin attestations dentro del manifiesto: Azure App Service espera una imagen simple.
          provenance: false
          tags: |
            ${{ env.IMAGE }}${{ matrix.suffix }}:latest
            ${{ env.IMAGE }}${{ matrix.suffix }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Procedencia del build (firmada, queda en GitHub)
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}${{ matrix.suffix }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
      - name: Avisar a Azure para que descargue la imagen nueva
        if: env.PUBLISH == 'true' && matrix.name == 'api' && env.AZURE_WEBHOOK != ''
        run: curl -fsS -X POST "$AZURE_WEBHOOK" -o /dev/null

