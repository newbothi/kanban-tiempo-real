name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Solo para CI: la base de prueba vive dentro del contenedor del servicio.
  MSSQL_SA_PASSWORD: Kanban_CI_2026!
  DATABASE_URL: sqlserver://localhost:1433;database=kanban_test;user=sa;password=Kanban_CI_2026!;encrypt=true;trustServerCertificate=true
  JWT_SECRET: secreto-de-ci-con-mas-de-32-caracteres-xxxx

jobs:
  check:
    name: Tipos, tests unitarios y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w @kanban/api
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  integration:
    name: API + E2E contra SQL Server
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Kanban_CI_2026!
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Kanban_CI_2026! -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Crear base de prueba
        run: >
          docker exec ${{ job.services.mssql.id }}
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C
          -Q "IF DB_ID('kanban_test') IS NULL CREATE DATABASE kanban_test"
      - run: npm run db:generate -w @kanban/api
      - name: Tests de integración (Vitest)
        run: npm run test:api
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Tests E2E (Playwright, dos usuarios)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Imagen Docker → GHCR
    # Solo si TODO lo anterior pasó y es un push a main.
    needs: [check, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Opcional: URL del webhook de Azure (Centro de implementación) para redesplegar solo.
      AZURE_WEBHOOK: ${{ secrets.AZURE_WEBAPP_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Avisar a Azure para que descargue la imagen nueva
        if: env.AZURE_WEBHOOK != ''
        run: curl -fsS -X POST "$AZURE_WEBHOOK" -o /dev/null
