# S-23: Dependabot propone PRs con las actualizaciones. Cada PR pasa por todo el CI
# (tests, lint, cobertura, audit y Trivy) antes de poder fusionarse.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Parches y versiones menores en un solo PR; las mayores van por separado.
      npm-menores:
        update-types: [minor, patch]
    ignore:
      # Los tipos de Node siguen a la versión que corre en producción (Node 24 LTS).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 queda para cuando typescript-eslint lo soporte (hoy pide < 6.1).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: pip
    directory: /apps/ml
    schedule:
      interval: weekly
      day: monday
    groups:
      pip-menores:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /apps/ml]
    schedule:
      interval: weekly
      day: monday
    # Solo parches y digests nuevos de la misma versión. Cambiar Node o Python de versión se hace
    # a mano, junto con la versión que usa el CI para los tests (si no, se probaría una y se
    # publicaría otra).
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
